services:
  mysql:
    image: mysql:8.4
    container_name: bot-moedas-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-botmoedas}
      MYSQL_USER: ${DB_USER:-botmoedas}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
    volumes:
      - mysql-data:/var/lib/mysql
    # Only reachable from this machine, so `npm start` outside Docker can use it.
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    image: bot-moedas:latest
    container_name: bot-moedas
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./botData:/usr/src/app/botData
    ports:
      - "4738:4738"

volumes:
  mysql-data:
